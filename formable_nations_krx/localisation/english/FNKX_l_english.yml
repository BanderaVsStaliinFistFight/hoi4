l_english:

 # Category and shared texts
 FNKX_formable_nations:0 "Formable Nations"
 FNKX_formable_nations_desc:0 "Old empires lie in ruins and new borders are drawn in blood. A nation that brings the right lands under its control, directly or through its subjects, can proclaim a greater state, claiming the whole of its historic territory."
 FNKX_held_by_ROOT_tt:0 "Is owned and controlled by us or one of our subjects"
 FNKX_region_cores_tt:0 "Our subjects belonging to the new nation are §Yannexed§!. We gain §Ycores§! on every state of the new nation that we own, and §Yclaims§! on every state that we do not."
 FNKX_unification_spirit:0 "Euphoria of Unification"
 FNKX_unification_spirit_desc:0 "Our people celebrate the birth of a greater nation. While the enthusiasm lasts, the government enjoys broad support."

 # News event
 fnkx.1.t:0 "[From.GetName] Proclaimed"
 fnkx.1.d:0 "Before vast crowds gathered in the capital, [From.GetLeader] has formally proclaimed the founding of [From.GetNameDef]. Long divided by war, revolution and the ambitions of foreign powers, the peoples of the region now stand under a single banner.\n\nWhether the new [From.GetAdjective] state brings lasting peace or only a larger war remains to be seen."
 fnkx.1.a:0 "A new power rises."
 fnkx.1.b:0 "Our nation is reborn!"

 # Game rules
 RULE_GROUP_FNKX:0 "Formable Nations"
 RULE_FNKX_FORMABLES_RULE:0 "Formable Nations"
 RULE_OPTION_FNKX_HISTORICAL:0 "Historical Candidates"
 RULE_OPTION_FNKX_HISTORICAL_DESC:0 "Only nations with a historical tie to a formable nation can proclaim it."
 RULE_OPTION_FNKX_REGIONAL:0 "Historical and Regional"
 RULE_OPTION_FNKX_REGIONAL_DESC:0 "Historical candidates, plus any nation whose capital lies inside the formable nation's territory."
 RULE_OPTION_FNKX_DISABLED:0 "Disabled"
 RULE_OPTION_FNKX_DISABLED_DESC:0 "No formable nation decisions from this submod."
 RULE_FNKX_FORMABLES_AI_RULE:0 "AI Formable Nations"
 RULE_OPTION_FNKX_AI_ALLOWED:0 "Allowed"
 RULE_OPTION_FNKX_AI_ALLOWED_DESC:0 "AI nations can proclaim formable nations."
 RULE_OPTION_FNKX_AI_PLAYERS_ONLY:0 "Players Only"
 RULE_OPTION_FNKX_AI_PLAYERS_ONLY_DESC:0 "Only human players can proclaim formable nations."

